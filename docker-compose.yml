
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    volumes:
      - db_data:/var/lib/mysql
      # Initial database dump for initialization
      - ./sql/setup_ps_uu_periegesis.sql:/docker-entrypoint-initdb.d/setup_ps_uu_periegesis.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
    ports:
      - "8044:80"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_CHARSET=${DB_CHARSET}
      - SITE_SOCKET=${SITE_SOCKET}
      - SITE_URL=${SITE_URL}
      - CHECK_TRUE_SITE=${CHECK_TRUE_SITE}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
